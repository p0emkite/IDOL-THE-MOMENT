<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080612">
  <meta name="description" content="ITM 실제 3D 무대·스포트라이트·카드팩 개봉 인터페이스 체험 시안">
  <title>ITM — 3D STAGE EXPERIENCE</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./stage-preview-3d.css">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
  </script>
</head>
<body>
  <div id="experience">
    <canvas id="stage3d" aria-label="움직이는 조명 아래 실제 3D 카드팩이 놓인 무대"></canvas>
    <div id="vignette"></div>
    <div id="grain"></div>
    <div id="glint"></div>
    <header class="top-ui">
      <a href="./" class="icon-button" aria-label="기존 ITM 메인 페이지로 돌아가기" title="ITM 메인">‹</a>
      <div class="stage-brand">ITM · IDOL THE MOMENT</div>
      <button class="icon-button" id="replay" type="button" title="진입 연출 다시 보기" aria-label="진입 연출 다시 보기">↻</button>
    </header>
    <div class="actions" id="actions">
      <button id="drawOne" type="button" class="action one">1회 뽑기</button>
      <button id="drawFive" type="button" class="action five">5회 뽑기</button>
    </div>
    <div id="result-ui" hidden>
      <div class="result-top"><div class="result-title">ITM CARD REVEAL</div><div id="progress" class="result-progress">0 / 5</div></div>
      <div class="result-hint" id="resultHint" role="status">카드를 터치해 공개하세요. 좌우로 밀어 다른 카드를 볼 수 있어요.</div>
      <div class="result-bottom">
        <button id="revealAll" class="result-button" type="button">모두 공개</button>
        <button id="backToStage" class="result-button primary" type="button">무대로 돌아가기</button>
      </div>
    </div>
    <div id="intro">
      <div class="intro-glow"></div>
      <div class="intro-curtain left"></div><div class="intro-curtain right"></div>
      <div class="intro-mark"><b>ITM</b><span>IDOL : THE MOMENT</span></div>
      <button id="skip" type="button">SKIP ›</button>
    </div>
    <div id="loading"><b>ITM</b><span></span></div>
    <div id="fallback" hidden>
      <div class="fallback-inner">
        <h2>ITM</h2>
        <p>3D 무대를 불러오지 못했습니다.<br>브라우저 WebGL 설정 또는 인터넷 연결을 확인해 주세요.</p>
        <a href="./">기존 ITM으로 돌아가기</a>
      </div>
    </div>
  </div>
  <script type="module" src="./stage-preview-3d.js"></script>
</body>
</html>
